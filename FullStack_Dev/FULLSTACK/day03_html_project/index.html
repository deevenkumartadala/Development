<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="A Personal developer Portfolio">
		<title>Personal Portfolio</title>
		<link rel="icon" type="image/jpeg" href="/images/favicon.jpg">
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header>
			<h1>My Developer Profile</h1>
			
			<nav aria-label="Main Navigation">
				<a href="#about">About</a>
				<a href="#skills">Skills</a>
				<a href="#contact">Contact</a>
			</nav>
		</header>
		
		<main>
			<section id="about">
				<h2>About Me</h2>
				<p>I'm Learning to build real-world web applications.</p>
			</section>
			
			<section id="skills">
				<h2>Technical Skills</h2>
				<ul>
					<li>Python</li>
					<li>HTML</li>
					<li>Javascript</li>
				</ul>
			</section>
			
			<section id="contact">
				<h2>Contact Me</h2>
				
				<form>
					<label for="name">Name</label>
					<input id="name" name="name" type="text" placeholder="Your Name" required>
					
					<label for="email">Email Address</label>
					<input id="email" name="email" type="email" placeholder="Your Email" required>
					
					<label for="number">Mobile Number</label>
					<input id="number" name="number" type="tel" placeholder="Your Phone number" required>
					
					<button type="submit">Submit</button>
				</form>
			</section>
		</main>
		<footer>
			<p>My Developer Profile</p>
		</footer>
	</body>
</html>
