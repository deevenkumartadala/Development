<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<link rel="stylesheet" href="styles.css">
		<script src="script.js" defer></script>
		<title>Css Architecture</title>
	</head>
	
	<body class="dashboard">
		<header class="dashboard-header">
			<h1 class="dashboard-header__title">Admin Dashboard</h1>
		</header>
		
		<main class="dashboard-content" id="dashboard">
			
			<aside class="dashboard-sidebar">
				<nav class="sidebar-nav">
					<a class="sidebar-nav__link" href="#main">Main</a>
					<a class="sidebar-nav__link" href="#dashboard">Dashboard</a>
					<a class="sidebar-nav__link" href="#users">Users</a>
					<a class="sidebar-nav__link" href="#products">Products</a>
					<a class="sidebar-nav__link" href="#settings">Settings</a>
				</nav>
			</aside>
			
			<section class="dashboard-main" id="main">
				<h2 class="main-title">Overview</h2>

				<section class="main-cards">

					<section class="main-card">
						<h3 class="main-card__title">Total Users</h3>
						<p class="main-card__info">1250</p>
						<button class="main-card__button">view details</button>
					</section>

					<section class="main-card">
						<h3 class="main-card__title">Total Products</h3>
						<p class="main-card__info">450</p>
						<button class="main-card__button">view details</button>
					</section>

					<section class="main-card">
						<h3 class="main-card__title">Total Sales</h3>
						<p class="main-card__info">₹85,000</p>
						<button class="main-card__button">view details</button>
					</section>

				</section>
			
				<section class="main-users">

					<h2 class="main-users__title">Recent Users</h2>

					<ul class="main-users__list">
						<li class="main-user">
							<span class="main-user__name">Ravi</span>
							<span class="main-user__active">Active</span>
						</li>

						<li class="main-user">
							<span class="main-user__name">Arun</span>
							<span class="main-user__pending">Pending</span>
						</li>

						<li class="main-user">
							<span class="main-user__name">Kiran</span>
							<span class="main-user__active">Active</span>
						</li>
					</ul>

				</section>

				<section class="main-activity">
					<h2 class="main-activity__title">Recent Activity</h2>
					<p class="main-activity__info">Users registered successfully.</p>
					<p class="main-activity__info">Products added.</p>
					<p class="main-activity__info">Orders completed.</p>
				</section>

			</section>

		</main>

		<footer class="dashboard-footer">

			<p class="footer-content">@copyright</p>
			
		</footer>

	</body>

</html>
